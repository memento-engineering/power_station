name: power_station_workspace
publish_to: none
environment:
  sdk: ^3.11.0
workspace:
  - packages/grid_assets
  - packages/dart_grid_assets
  - packages/federated_grid_assets
  - packages/zero_conf_grid_assets
  - packages/github_grid_assets

# Cross-repo linkage: the the_grid framework packages (grid_engine, grid_cli,
# beads_dart, …) are declared `any` in each pack and resolved via the
# machine-local `pubspec_overrides.yaml` at this root (path deps into the
# sibling ../the_grid checkout during dev; hosted/git refs at stabilization).
# That file is gitignored — the dart domain's `grid dart link` generates it.
# genesis_tree stays hosted (^0.3.0 — InheritedModelSeed, bead pow-n6n.2).
# See the_grid docs/SCRATCH-pub-capability-and-repo-split.md.

# VERSION overrides (never path overrides — ADR-0003 D5 keeps those machine-local
# in the gitignored pubspec_overrides.yaml). These are checked in because they are
# machine-independent and CI resolves with no overrides file at all. Each one works
# around a producer that is broken on pub.dev, and each retires when that producer
# republishes:
#   genesis_perception — leonard_contract 0.2.1 pins ^0.2.0, but genesis_perception
#     0.2.0 does not compile against genesis_tree 0.3.0 (its _PerceptionHandle
#     "has fewer named arguments than" TreeContext.dependOnInheritedSeedOfExactType,
#     which 0.3.0 widened with {Object? aspect}). Retires when lenny republishes
#     leonard_contract against genesis_perception ^0.3.0.
#   genesis_tree — grid_cli 0.5.0-rc.8 (the newest hosted release that compiles,
#     see github_grid_assets' cap) still pins ^0.2.0. Retires when the_grid
#     republishes grid_exploration + grid_cli against genesis_tree ^0.3.0.
dependency_overrides:
  genesis_perception: ^0.3.0
  genesis_tree: ^0.3.0

dev_dependencies:
  melos: ^7.7.0

melos:
  scripts:
    # ---------- primary scripts ----------
    test:
      description: >-
        Run the offline unit suite (excludes `integration`-tagged tests, which
        need out-of-process dependencies). All packs are pure Dart.
      exec: dart test -x integration
      packageFilters:
        flutter: false
        dirExists: test

    analyze:
      description: >-
        Run dart analyze on the entire workspace.
      run: dart analyze

    format:
      description: >-
        Check formatting for all Dart files. Fails if any file needs changes.
      run: dart format --output=none --set-exit-if-changed .
