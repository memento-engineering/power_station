name: github_grid_assets
version: 0.1.0-rc.6
description: GitHub App identity and authenticated REST transport for grid extensions.
repository: https://github.com/memento-engineering/power_station
resolution: workspace

# Test fixtures, not credentials: throwaway RSA keys minted for the token
# provider's offline tests. pub's pre-publish secret scan flags any PEM.
false_secrets:
  - /test/fixtures/github_app_test_private.pem
  - /test/fixtures/github_app_test_private_two.pem

environment:
  sdk: ^3.11.0

dependencies:
  beads_dart: ^0.2.0-rc.4
  dart_jsonwebtoken: ^3.4.1
  freezed_annotation: ^3.0.0
  genesis_tree: ^0.3.0
  grid_assets: ^0.6.0-rc.5
  # CAPPED, not caret: grid_cli 0.5.0-rc.9 is broken on pub.dev — it imports
  # `DevModeHost` from grid_exploration, but the published grid_exploration
  # 0.3.0-rc.3 exports `DevModeSeat` (the rename lives only in the_grid's
  # unpublished checkout), so every hosted consumer fails to compile with
  # "up_command.dart:744: Error: Type 'DevModeHost' not found". A caret would
  # admit rc.9 and pub prefers the newest admitted version. Lift this the moment
  # the_grid republishes grid_exploration and grid_cli together.
  grid_cli: ">=0.5.0-rc.8 <0.5.0-rc.9"
  grid_diagnostics_contract: ^0.2.0
  grid_engine: ^0.3.0-rc.10
  grid_runtime: ^0.2.0-rc.6
  grid_sdk: ^0.3.0-rc.8
  json_annotation: ^4.9.0
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  lints: ^5.1.0
  state_notifier: ^1.0.0
  test: ^1.25.0
