name: grid_assets
description: >-
  The_grid's opinion assets — the agent/verify/land Capability impls + the
  `code` formula + the git SourceControl, extracted out of the opinion-free
  engine (grid_engine) so the engine holds no landing/VCS/provider opinion
  (ADR-0007 §1). A station runner wires these via `buildCodeRegistry` + a
  `FormulaResolver`, or assembles the exported `CodeRunCommand`. The
  power_station home of the first-party assets.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  # The exported CLI components (the asset's Command offering — the CLI-SDK
  # model): CodeRunCommand extends the CLI-SDK's StationRunCommand (grid_cli is
  # a the_grid framework lib; no cycle — grid_cli no longer depends on
  # grid_assets).
  args: ^2.6.0
  dart_grid_assets: any
  genesis_tree: ^0.1.3
  grid_cli: any
  grid_controller: any
  grid_engine: any
  grid_federation: any
  grid_runtime: any
  meta: ^1.16.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.1.0
  state_notifier: ^1.0.0
  test: ^1.25.0
  yaml: ^3.1.2
