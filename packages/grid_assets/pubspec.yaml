name: grid_assets
# Released as git tags per package (ADR-0003 D1: `<package>-v<version>`);
# consumers pin `git: {url, ref, path}`.
version: 0.1.0
description: >-
  The_grid's opinion assets — the agent/verify/land Capability impls + the
  `code` circuit + the git SourceControl, extracted out of the opinion-free
  engine (grid_engine) so the engine holds no landing/VCS/provider opinion
  (ADR-0007 §1). A station runner wires these via `buildCodeRegistry` + a
  `CircuitResolver`. The power_station home of the first-party assets.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.6.0
  beads_dart:
    # Cross-repo release pin (power_station ADR-0003 D1): adopt a
    # the_grid change DELIBERATELY by bumping the version constraint. Dev co-editing
    # still rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/the_grid.git
      tag_pattern: beads_dart-v{{version}}
      path: packages/beads_dart
    version: ^0.1.0
  dart_grid_assets:
    # Intra-repo sibling as a git SELF-REF tag pin (ADR-0003 D1): pub
    # unifies git deps by REF STRING, so every route to a released
    # package must carry the SAME {url, tag_pattern, path} descriptor; the version
    # CONSTRAINT then solves over the release tags.
    # Workspace/dev resolution unchanged; tags move in lockstep.
    git:
      url: git@github.com:memento-engineering/power_station.git
      tag_pattern: dart_grid_assets-v{{version}}
      path: packages/dart_grid_assets
    version: ^0.1.0
  extension_discovery: ^2.1.0
  federated_grid_assets:
    # Intra-repo sibling as a git SELF-REF tag pin (ADR-0003 D1): pub
    # unifies git deps by REF STRING, so every route to a released
    # package must carry the SAME {url, tag_pattern, path} descriptor; the version
    # CONSTRAINT then solves over the release tags.
    # Workspace/dev resolution unchanged; tags move in lockstep.
    git:
      url: git@github.com:memento-engineering/power_station.git
      tag_pattern: federated_grid_assets-v{{version}}
      path: packages/federated_grid_assets
    version: ^0.1.0
  genesis_tree: ^0.1.3
  grid_engine:
    # Cross-repo release pin (power_station ADR-0003 D1): adopt a
    # the_grid change DELIBERATELY by bumping the version constraint. Dev co-editing
    # still rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/the_grid.git
      tag_pattern: grid_engine-v{{version}}
      path: packages/grid_engine
    version: ^0.1.0
  grid_runtime:
    # Cross-repo release pin (power_station ADR-0003 D1): adopt a
    # the_grid change DELIBERATELY by bumping the version constraint. Dev co-editing
    # still rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/the_grid.git
      tag_pattern: grid_runtime-v{{version}}
      path: packages/grid_runtime
    version: ^0.1.0
  grid_sdk:
    # Cross-repo release pin (power_station ADR-0003 D1): adopt a
    # the_grid change DELIBERATELY by bumping the version constraint. Dev co-editing
    # still rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/the_grid.git
      tag_pattern: grid_sdk-v{{version}}
      path: packages/grid_sdk
    version: ^0.1.0
  meta: ^1.16.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.1.0
  state_notifier: ^1.0.0
  test: ^1.25.0
  yaml: ^3.1.2
