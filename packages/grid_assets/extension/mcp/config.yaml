# The Circuit — code-review assets, authored in the Dart/Flutter
# "Packaged AI Assets" format (per flutter.dev/go/packaged-ai-assets, the
# package:extension_discovery `extension/mcp/config.yaml` shape). We follow it as
# a SPEC so the_grid's systems use it now AND can pivot if the community adopts
# it. Dart-first: the active prompt/grade path is composed in Dart at the engine's
# CapabilityRegistry seam (grid_assets); this manifest is the portable, declarative
# mirror of those same assets. The TOML PackInflater is deferred (D-9).
name: grid_assets
version: 1

# Rubric prose — one resource per committee lane. `visibility: public` is the
# open-source split (a closed rubric would be `private`). Each is a plain
# markdown file the critic capability embeds, in isolation, into its prompt.
resources:
  - id: code-validation
    description: The GATING lane — runs the bead's own Validation Plan; F on any non-zero command.
    path: rubrics/code-validation.md
    visibility: public
  - id: spec-adherence
    description: Does the diff implement the bead's Implementation Plan + acceptance criteria?
    path: rubrics/spec-adherence.md
    visibility: public
  - id: regression-risk
    description: The blast radius — how likely is the change to break existing behavior?
    path: rubrics/regression-risk.md
    visibility: public
  - id: test-coverage
    description: Are the changes covered by MEANINGFUL (non-vacuous) tests?
    path: rubrics/test-coverage.md
    visibility: public
  # The spec-readiness pack (bead pow-6ao) — the committee that gates the
  # SPECIFY stage, upstream of the build. Same loader, same critic machine.
  - id: spec-validation
    description: The GATING spec lane — a deterministic structural check over the bead's spec; F on any missing section or placeholder.
    path: rubrics/spec-validation.md
    visibility: public
  - id: coherence
    description: Does the spec carve scope cleanly from sibling beads AND extend existing code rather than duplicate it?
    path: rubrics/coherence.md
    visibility: public
  - id: adr-alignment
    description: Does the spec cite and align with the substation's docs/adr register (ADR-0000 amendments included)?
    path: rubrics/adr-alignment.md
    visibility: public
  - id: decision-alignment
    description: Does the spec cite and align with every recorded decision the station's ROSTER union governs its touched surfaces with?
    path: rubrics/decision-alignment.md
    visibility: public
  - id: acceptance-testability
    description: Are the acceptance criteria testable by exact commands, with a 1:1 validation-plan mapping?
    path: rubrics/acceptance-testability.md
    visibility: public
  - id: plan-completeness
    description: Is the implementation plan literal and decision-free — exact Dart code, file paths, test commands, commits?
    path: rubrics/plan-completeness.md
    visibility: public
  # The spec-readiness INTAKE lens (bead pow-q7n) — the cheap pre-specify ladder
  # that grades the BEAD (not the spec, not a diff) before the architect runs.
  - id: bead-readiness
    description: The INTAKE lens — is the BEAD ready to specify (scope, acceptance shape, cited constraints, a decided approach)? D or worse HOLDS it for refinement.
    path: rubrics/bead-readiness.md
    visibility: public
  # The DOCS-CHANGE pack — the committee that reviews a prose diff. Its three
  # GATING lanes are mechanical checks run in Dart, so this prose documents the
  # contract rather than feeding a model.
  - id: citation-paths-resolve
    description: The DOCS gating lane — every file path a changed doc cites must resolve in the tree.
    path: rubrics/citation-paths-resolve.md
    visibility: public
  - id: terminology-ban
    description: The DOCS gating lane — the org seam word is `extension`; the banned word is reserved for third-party proper nouns.
    path: rubrics/terminology-ban.md
    visibility: public
  - id: section-structure
    description: The DOCS gating lane — the sections a bead names (metadata.docs_sections) must be present in every changed doc.
    path: rubrics/section-structure.md
    visibility: public

# Prompts — the critic prompt template, mustache-templated. `{{rubric}}` /
# `{{rubricText}}` / `{{bead}}` are substituted per lane (the asset loader's
# renderPrompt; D-9). One critic per rubric, in isolation (anti-anchoring).
prompts:
  - id: critic
    description: One adversarial critic, grading the work against a single rubric in isolation.
    path: prompts/critic.md
    visibility: public
    args:
      - name: rubric
        description: The rubric id this critic grades against (the lane).
        required: true
      - name: rubricText
        description: The rubric's prose bands, loaded from resources/<rubric>.
        required: true
      - name: bead
        description: The full work bead under review (title/task/design/acceptance/notes).
        required: true
  - id: spec-critic
    description: One adversarial spec-readiness critic, grading the bead's SPEC (not a diff) against a single rubric in isolation.
    path: prompts/spec-critic.md
    visibility: public
    args:
      - name: rubric
        description: The rubric id this critic grades against (the lane).
        required: true
      - name: rubricText
        description: The rubric's prose bands, loaded from resources/<rubric>.
        required: true
      - name: bead
        description: The full work bead whose acceptance + design fields are the spec under review.
        required: true
  - id: readiness
    description: The cheap pre-specify intake lens, grading the work BEAD itself (no spec and no diff exists yet).
    path: prompts/readiness.md
    visibility: public
    args:
      - name: rubric
        description: The rubric id this lens grades against.
        required: true
      - name: rubricText
        description: The rubric's prose bands, loaded from resources/<rubric>.
        required: true
      - name: bead
        description: The full work bead under intake (title/task/design/acceptance/notes).
        required: true
  - id: discovery
    description: One read-only explorer in the discovery circuit — gathers context and CITES any offence; it grades nothing.
    path: prompts/discovery.md
    visibility: public
    args:
      - name: lens
        description: The lens this explorer runs (explore-code | explore-decision | explore-prior-art).
        required: true
      - name: lensBrief
        description: The lens's angle — what this explorer looks for.
        required: true
      - name: bead
        description: The full work bead being explored (title/task/design/acceptance/notes).
        required: true

# Skills — front-of-house agentic assets in the agentskills SKILL.md format
# (the same community shape lenny's leonard_cli assets ship). The upstream
# proposal defines only resources/prompts; this section is this manifest's
# forward extension of it, reusing the prompts' arg-declaration shape. Each
# skill dir under extension/station_overlay/claude/skills/<id>/ holds a
# mustache-templated SKILL.md — the overlay is ROOT-RELATIVE (it mirrors the
# target repo root), so the vended tree already carries the harness's own
# layout. Two legs install the rendered tree (the OverlayMaterializer — it
# REFUSES to write a file whose holes are unbound, and never clobbers a file it
# did not generate): this package's own provision-time wire
# (AgentCapability -> a per-bead worktree root) and the operator install Command
# (`assets install` -> a station repo root). The
# coupled skill+command pattern (ADR-0001): the skill CALLS the vended
# deterministic Command instead of re-deriving the operation by inference.
skills:
  - id: discover
    description: >
      The grid home's HITL front door — dispatches on arg shape
      (topic research / bead advisory / bead directed), researches via the
      vended `search` Command, and on the human's yes files an ephemeral
      staged bead and starts the design conversation (hand-off: specify).
    path: station_overlay/claude/skills/discover/SKILL.md
    visibility: public
    audience: agent
    args:
      - name: runner
        description: The composing station's executable name (e.g. `space`) — the verb the skill's search calls ride.
        required: true
  # The OPERATOR skill set — re-homed from the composing station's
  # hand-committed, installer-less `extension/skills/`. `<cli> install` expands
  # these into the operator's own `.claude/skills/`; the provision wire installs
  # them into a worktree too (one tree, two consumers) but does NOT name them in
  # a build agent's brief — most drive the station (one of them pushes), and
  # `asset-author` is authoring guidance for the operator's hands, not a build
  # agent's (see `kAgentSkills`).
  - id: asset-author
    description: >
      Author and install grid assets through B-style in-tree providers:
      watched nullable dependencies, diagnostic unavailability, explicit
      create/value ownership, scoped overrides, and assembly-only boot.
    path: station_overlay/claude/skills/asset-author/SKILL.md
    visibility: public
    audience: operator
  - id: station-operations
    description: >
      Operate the resident station — boot, bounce, tear down, read status, seed
      a grid home's state store, and diagnose a station that is up but driving
      nothing.
    path: station_overlay/claude/skills/station-operations/SKILL.md
    visibility: public
    audience: operator
    args:
      - name: runner
        description: The composing station's executable name (e.g. `space`) — the verb its boot/status/down calls ride.
        required: true
  - id: intake-refinement
    description: >
      Shape work beads so a resident station can drive them — the required
      validation_plan metadata, driveable issue types, dependency wiring, and
      stamped grid.approved approval via the approve verb.
    path: station_overlay/claude/skills/intake-refinement/SKILL.md
    visibility: public
    audience: operator
    args:
      - name: runner
        description: The composing station's executable name (e.g. `space`) — the verb its boot/status/down calls ride.
        required: true
  - id: harvest-review
    description: >
      Review and land what a station built — verify each terminal session's
      branch delta, committee grades, and validation plan in the real worktree,
      then push and open a PR with receipts.
    path: station_overlay/claude/skills/harvest-review/SKILL.md
    visibility: public
    audience: operator
    args:
      - name: runner
        description: The composing station's executable name — the verb its rework calls ride.
        required: true
  - id: gate-medicine
    description: >
      Diagnose and clear gated sessions — read the worktree critique artifacts,
      separate systemic failures from genuinely bad work, and re-arm with a
      rework round.
    path: station_overlay/claude/skills/gate-medicine/SKILL.md
    visibility: public
    audience: operator
    args:
      - name: runner
        description: The composing station's executable name — the verb its rework calls ride.
        required: true
  - id: release
    description: >
      Cut a disciplined pub.dev release — the consolidated genesis+lenny
      publishing playbook. Owns the judgement (when to publish, patch vs.
      breaking, breaking-CHANGELOG framing, tag-drift reconciliation) and CALLS
      the vended `dart release` Command for the deterministic work (version
      math, scrub gate, dry-run, pub.dev poll, dependency order).
    path: station_overlay/claude/skills/release/SKILL.md
    visibility: public
    audience: operator
    args:
      - name: runner
        description: The composing station's executable name — the verb the skill's `dart release` calls ride.
        required: true
station_overlay:
  mappings:
    claude: .claude
