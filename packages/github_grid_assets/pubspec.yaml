name: github_grid_assets
version: 0.2.0-dev.5
description: GitHub App identity and authenticated REST transport for grid extensions.
repository: https://github.com/memento-engineering/power_station
resolution: workspace

# Test fixtures, not credentials: throwaway RSA keys minted for the token
# provider's offline tests. pub's pre-publish secret scan flags any PEM.
false_secrets:
  - /test/fixtures/github_app_test_private.pem
  - /test/fixtures/github_app_test_private_two.pem

environment:
  sdk: ^3.11.0

dependencies:
  beads_dart: ^0.3.0-dev.2
  dart_jsonwebtoken: ^3.4.1
  freezed_annotation: ^3.0.0
  genesis_tree: ^0.4.0
  # Floored at rc.16: the intake store tests use kFilingApprovalRevisionPrefix,
  # first exported by grid_assets 0.6.0-rc.16 (the scrub gate caught the gap).
  grid_assets: ^0.7.0-dev.5
  # Floored with the_grid wave 3: grid_cli 0.5.0-rc.13 carries the
  # grid_engine/runtime/sdk rc.13/rc.11/rc.11 train.
  grid_cli: ^0.6.0-dev.3
  grid_diagnostics_contract: ^0.2.0
  grid_engine: ^0.4.0-dev.3
  grid_runtime: ^0.2.1-dev.2
  grid_sdk: ^0.4.0-dev.3
  json_annotation: ^4.9.0
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^3.0.0
  # TEST-ONLY: the reconciliation query is driven by a REAL `TrajectoryTick` in
  # the runtime suite, and the tick's two seams (`TrajectoryDb`, `TickAppender`)
  # are not part of grid_sdk's trajectory re-export. Library code names only
  # `ObligationQuery`/`ObligationAppend`, which grid_sdk does export.
  grid_trajectory: ^0.2.1-dev.2
  json_serializable: ^6.9.5
  lints: ^5.1.0
  state_notifier: ^1.0.0
  test: ^1.25.0
