name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # PINNED, deliberately. `sdk: stable` floats: when the channel moved to
          # 3.13.0 (2026-08-11/12) the formatter changed and 7 already-committed
          # test files became "unformatted", turning the workspace format gate red
          # on EVERY pull request without a single line of source changing.
          # CI must not drift ahead of the toolchain the station itself runs
          # (`dart run lunar:lunar` on 3.12.2). Bump this deliberately, together
          # with local SDKs and a reformat, never by channel drift.
          sdk: 3.12.2
      - name: Resolve workspace
        run: dart pub get
      - name: Format (workspace-wide)
        run: dart format --output=none --set-exit-if-changed packages
      - name: Analyze (workspace-wide)
        run: dart analyze
      - name: Test packages
        run: |
          for pkg in grid_assets dart_grid_assets federated_grid_assets zero_conf_grid_assets; do
            echo "::group::$pkg"
            (cd packages/$pkg && dart test)
            echo "::endgroup::"
          done
