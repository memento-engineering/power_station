name: federated_grid_assets
# Released as git tags per package (ADR-0003 D1: `<package>-v<version>`);
# consumers pin `git: {url, ref, path}`.
version: 0.1.0
description: >-
  Cross-station federation IMPLS (ADR-0011): the HTTP bus (StationServer /
  HttpStationClient), the owner-authoritative LeaseManager, static membership
  (Membership/Peer/MembershipLoader), and the git-over-LAN GitSyncService — plus
  the `serve`/`lease` CLI Commands, asset-exported the CLI-SDK way. The
  transport-free contracts (Presence/CapabilityFacts/the claim-lease protocol/
  the StationClient seam) live in `grid_engine`'s SDK ("the engine knows
  federation in concept, not detail"); this pack supplies the impls over them
  (the honesty-pass D-A9 split, 2026-07-03 — moved out of the_grid's
  `grid_federation`, which dissolves in AL-5b). Transport is an abstract seam —
  HTTP impl #1, MQTT/WS droppable in later.
  AL-6b (D-B1/D-B2/D-B3, 2026-07-03) adds the bus: the abstract single-writer
  `Broker` seam + an offline `InMemoryBroker` (no adequate pub.dev MQTT broker
  found on vet — see `src/broker/broker.dart`'s doc), the ACP-shaped JSON-RPC
  2.0 wire envelope (`src/protocol/`), and the D-A3 claim protocol
  (`ClaimBroadcaster`/`ClaimResponder`/`ClaimLeaseCapability`, `src/claim/`)
  consuming the engine's AL-6a `onUnclaimedFrontier`/`claimCapabilityFor`
  hooks. No MQTT wire transport yet (D-B5: none in the engine, ever; this pack
  proves the protocol offline first — a real wire transport is a follow-up
  behind the SAME `Broker` seam, exactly as HTTP shipped as impl #1 of
  `StationClient`).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.6.0
  genesis_tree: ^0.1.3
  grid_engine:
    # Cross-repo release pin (power_station ADR-0003 D1): adopt a
    # the_grid change DELIBERATELY by bumping the version constraint. Dev co-editing
    # still rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/the_grid.git
      tag_pattern: grid_engine-v{{version}}
      path: packages/grid_engine
    version: ^0.1.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
